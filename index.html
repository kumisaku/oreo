<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oreo Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;600&family=Spline+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('oreo:prefs') || '{}');
        document.documentElement.style.background = p.theme === 'dark' ? '#0a0a0c' : '#f0edf8';
        document.body.style.background = p.theme === 'dark' ? '#0a0a0c' : '#f0edf8';
      } catch(e) {
        document.documentElement.style.background = '#f0edf8';
        document.body.style.background = '#f0edf8';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
